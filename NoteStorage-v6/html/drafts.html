<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/drafts.css">
    <title>NoteStorage | Черновики</title>
</head>

<body>
    <section class="wrapper">
        <header>
            <div class="container header-wrapper">
                <div class="logo-and-nav">
                    <a href="home.html" class="logo-name">
                        <div class="logo"></div>
                        <h1>NoteStorage</h1>
                    </a>
                    <div class="burger-menu" id="burger"></div>
                    <nav class="dropdown" id="dropdown">
                        <div class="dropdown-list">
                            <a href="home.html">Главная</a>
                            <a href="notes.html">Все заметки</a>
                            <a class="drafts-link-group" href="drafts.html">
                                <p>Корзина</p>
                            </a>
                        </div>
                    </nav>
                    <div class="nav-list">
                        <a href="home.html">Главная</a>
                        <a href="notes.html">Все заметки</a>
                        <a class="drafts-link-group" href="drafts.html">
                            <p>Корзина</p>
                            <div title="Корзина" class="trash"></div>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section class="container drafts-container">
                <h1 class="title-of-drafts">Черновики</h1>
                <div class="drafts">
                    <div class="draft">
                        <div class="header-of-draft">
                            <button title="Восстановить" type="button" class="remove-draft">
                                <div class="remove"></div>
                            </button>
                            <div class="title-of-draft-block">
                                <h2 class="title-of-draft">Название...</h2>
                            </div>
                            <button title="Удалить" type="button" class="bin-of-draft">
                                <div class="trash"></div>
                            </button>
                        </div>
                        <div class="text-of-draft-block">
                            <p class="text-of-draft">.........</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <div class="footer-block container">
                <div class="footer-info">
                    <p>NoteStorage - онлайн заметки с форматированием прямо в вашем браузере.</p>
                </div>
                <div class="links">
                    <a href="/html/home.html">Главная</a>
                    <a href="/html/drafts.html">Черновики</a>
                </div>
            </div>
        </footer>
    </section>

    <script src="/js/burger-menu.js"></script>
</body>

</html>
